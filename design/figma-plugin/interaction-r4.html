<!doctype html><meta charset="utf-8"><style>body{font:13px -apple-system;padding:16px;background:#eee;color:#171717}textarea{width:100%;height:260px;font:10px monospace}button,input{padding:8px;margin:4px;border:1px solid #aaa;border-radius:6px;background:#fff}</style><b>R4 · 网络与交互局部更新</b><p id="status">先读取当前四个区域，再应用经过核对的局部变更。</p><input id="target" placeholder="节点 ID"><button data-type="inspect">读取</button><button data-type="focus">定位</button><button data-type="apply">应用本轮</button><button data-type="audit">验收</button><button data-type="gallery">导出截图</button><button id="save">保存记录</button><textarea id="report" readonly></textarea><script>let report;function save(d,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type}));a.download=name;a.click()}onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;document.getElementById('status').textContent=m.status||'完成';if(m.gallery){const html='<!doctype html><meta charset="utf-8"><style>body{background:#ddd;font:14px system-ui}main{display:grid;grid-template-columns:repeat(4,393px);gap:24px}img{width:393px}figure{margin:0}figcaption{height:44px}</style><main>'+m.gallery.map(x=>{let s='';for(let i=0;i<x.bytes.length;i+=32768)s+=String.fromCharCode(...x.bytes.slice(i,i+32768));return '<figure data-id="'+x.id+'"><figcaption>'+x.name+'</figcaption><img src="data:image/png;base64,'+btoa(s)+'"></figure>'}).join('')+'</main>';save(html,'text/html','figma-r4-gallery.html')}else if(!m.progress){report=m;document.getElementById('report').value=JSON.stringify(m).slice(0,24000)}};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>parent.postMessage({pluginMessage:{type:b.dataset.type,target:document.getElementById('target').value}},'*'));document.getElementById('save').onclick=()=>save(JSON.stringify(report,null,2),'application/json','figma-r4-report.json');</script>
