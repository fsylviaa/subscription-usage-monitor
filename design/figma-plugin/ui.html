<!doctype html><meta charset="utf-8"><style>body{font:13px -apple-system;padding:12px;color:#171717}textarea{width:100%;height:150px;font:11px monospace}button{padding:6px 8px;margin:6px 5px 5px 0}input{width:180px}</style><b>订阅额度 · 设计修订</b><p id="status">准备检查文件</p><textarea id="report" readonly></textarea><div><button data-type="inspect">读取文件</button><button data-type="library">更新组件</button><button data-type="build">更新界面</button><button data-type="wire">连接原型</button><button data-type="audit">检查原型</button><button data-type="cleanup">整理旧页面</button><input id="target" placeholder="Light/Dashboard"><button data-type="focus">定位画面</button><button data-type="close">关闭</button></div><script>onmessage=e=>{let m=e.data.pluginMessage;if(m){document.getElementById('status').textContent=m.status||'完成';document.getElementById('report').value=JSON.stringify(m,null,2)}};document.querySelectorAll('button').forEach(b=>b.onclick=()=>parent.postMessage({pluginMessage:{type:b.dataset.type,target:document.getElementById('target').value}},'*'));</script>
