<!doctype html><meta charset="utf-8"><style>body{font:13px -apple-system;padding:16px;color:#171717;background:#f6f6f6}textarea{box-sizing:border-box;width:100%;height:330px;font:10px monospace;border:1px solid #ddd;border-radius:8px;padding:8px}button{padding:8px 10px;margin:6px 4px 0 0;border:1px solid #ccc;border-radius:7px;background:white}input{width:170px;padding:8px;border:1px solid #ccc;border-radius:6px}</style><b>订阅额度 · 评审区画面微调 R3</b><p>仅处理两套“修订界面与评审入口”。不修改交互区、连线或动画。</p><p id="status">准备读取</p><textarea id="report" readonly></textarea><div><input id="target" placeholder="节点 ID（可留空）"><button data-type="inspect">读取画面</button><button data-type="focus">定位画面</button><button data-type="apply">应用画面调整</button><button data-type="finalize">最终检查</button><button data-type="finish">完成细节</button><button data-type="fix">校正画面</button><button data-type="gallery">导出全套画面</button><button data-type="audit">检查画面</button><button data-type="export">导出画面</button><button data-type="ledger">修改记录</button><button id="save">保存记录</button><button data-type="close">关闭</button></div><script>let report;function save(data,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()};onmessage=e=>{const m=e.data.pluginMessage;if(m){document.getElementById('status').textContent=m.status||'完成';if(m.gallery){const html='<!doctype html><meta charset="utf-8"><title>订阅额度 · R3 画面审核</title><style>body{margin:32px;background:#dedede;font:14px system-ui;color:#202020}main{display:grid;grid-template-columns:repeat(4,393px);gap:28px}figure{margin:0}figcaption{height:50px;overflow-wrap:anywhere}img{width:393px;border-radius:36px}</style><h1>订阅额度 · R3 画面审核</h1><p>只调整画面，交互与动画待审核后处理。</p><main>'+m.gallery.map(x=>{let str='';for(let i=0;i<x.bytes.length;i+=32768)str+=String.fromCharCode(...x.bytes.slice(i,i+32768));return '<figure data-id="'+x.id+'"><figcaption>'+x.name+'</figcaption><img src="data:image/png;base64,'+btoa(str)+'"></figure>'}).join('')+'</main>';save(html,'text/html','figma-review-r3-gallery.html')}else if(m.image){save(new Uint8Array(m.image),'image/png',m.filename)}else{report=m;document.getElementById('report').value=JSON.stringify(m)}}};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>parent.postMessage({pluginMessage:{type:b.dataset.type,target:document.getElementById('target').value}},'*'));document.getElementById('save').onclick=()=>save(JSON.stringify(report,null,2),'application/json','figma-review-r3-report.json');</script>
