<!doctype html><meta charset="utf-8"><style>body{font:13px -apple-system;padding:16px;background:#f4f4f4;color:#171717}textarea{width:100%;height:320px;box-sizing:border-box;font:10px monospace}button,input{padding:8px;margin:4px 2px;border:1px solid #aaa;border-radius:6px;background:white}</style><b>R3 · 指定文字与留白精简</b><p>仅浅深评审区。保留交互区、组件库、连线与动画。</p><p id="status">准备读取</p><textarea id="report" readonly></textarea><input id="target" placeholder="节点 ID"><button data-type="inspect">读取</button><button data-type="focus">定位</button><button data-type="gallery">导出静态画面</button><button data-type="apply">精简指定文字</button><button data-type="audit">验收</button><button data-type="tighten">收紧弹层留白</button><button id="save">保存记录</button><button data-type="close">关闭</button><script>let report,phase='after';function save(d,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type}));a.download=name;a.click();}onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;document.getElementById('status').textContent=m.status||'完成';if(m.gallery){const html='<!doctype html><meta charset="utf-8"><title>R3 文字精简 '+phase+'</title><style>body{margin:24px;background:#dedede;font:14px system-ui}main{display:grid;grid-template-columns:repeat(4,393px);gap:24px}figure{margin:0}figcaption{height:38px}img{width:393px}</style><main>'+m.gallery.map(x=>{let s='';for(let i=0;i<x.bytes.length;i+=32768)s+=String.fromCharCode(...x.bytes.slice(i,i+32768));return '<figure data-id="'+x.id+'"><figcaption>'+x.name+'</figcaption><img src="data:image/png;base64,'+btoa(s)+'"></figure>';}).join('')+'</main>';save(html,'text/html','figma-r3-text-'+phase+'-gallery.html');}else if(!m.status.startsWith('导出')){report=m;document.getElementById('report').value=JSON.stringify(m);if(m.applied)phase='after';}};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>parent.postMessage({pluginMessage:{type:b.dataset.type,target:document.getElementById('target').value,phase}},'*'));document.getElementById('save').onclick=()=>save(JSON.stringify(report,null,2),'application/json','figma-r3-text-'+phase+'-report.json');</script>
