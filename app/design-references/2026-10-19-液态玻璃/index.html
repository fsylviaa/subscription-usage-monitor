<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订阅额度</title>
<!--
  Glass effect adapted from "liquid-glass-effect" by Kevin Ramirez
  https://github.com/kevinbism/liquid-glass-effect — MIT License, Copyright (c) 2025 Kevin Ramirez
-->
<style>
  :root{
    --ink:#16181c;
    --ink2:#2a2d33;
    --muted:#868b93;
    --nav-off:#8c9098;
    --fog:126,155,210;           /* 雾蓝 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 30% 10%,#eceef0 0%,#e2e3e6 60%,#d9dbdf 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--ink);
  }
  #stage{width:414px;height:896px;transform-origin:center center;flex:none}

  /* ---------- 屏幕 414 × 896（图二 1x 原尺寸） ---------- */
  .screen{
    position:relative;isolation:isolate;   /* 让 .glass::after(z-index:-1) 画在屏幕背景之上 */
    width:414px;height:896px;overflow:hidden;border-radius:44px;
    background:
      radial-gradient(240px 200px at 20% 14%,rgba(255,255,255,.95),transparent 70%),
      radial-gradient(260px 220px at 86% 30%,rgba(214,216,221,.7),transparent 70%),
      radial-gradient(300px 240px at 12% 46%,rgba(218,220,224,.75),transparent 70%),
      radial-gradient(280px 260px at 78% 58%,rgba(255,255,255,.7),transparent 70%),
      linear-gradient(180deg,#e9eaed 0%,#e3e4e7 50%,#dedfe3 100%);
    box-shadow:0 30px 70px rgba(110,118,135,.22);
  }
  .abs{position:absolute}

  /* ================= Liquid / frosted glass（源自 liquid-glass-effect） ================= */
  /* 参考图：板面几乎透明、粗白亮边、内侧细灰折射线、两端弧面灰影、底沿亮面 + 贴边短投影 */
  .glass{
    position:absolute;
    background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.08) 55%,rgba(255,255,255,.18) 100%);
    backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
    border:2px solid rgba(255,255,255,.95);
    box-shadow:
      /* 外：底沿亮线 + 贴边短投影 + 很淡的大范围阴影 */
      0 1.5px 0 rgba(255,255,255,.95),
      0 3px 4px rgba(112,118,132,.22),
      0 12px 22px -8px rgba(112,118,132,.20),
      /* 内：亮边内侧的细灰折射线 */
      inset 0 0 0 1px rgba(150,156,168,.30),
      /* 内：上沿亮面 */
      inset 0 3px 3px -1px rgba(255,255,255,.85),
      /* 内：底沿亮面 */
      inset 0 -4px 3px -1px rgba(255,255,255,.95),
      /* 内：左右两端弧面灰影 */
      inset 14px 0 14px -12px rgba(140,146,160,.22),
      inset -14px 0 14px -12px rgba(140,146,160,.22);
  }
  .glass::after{ /* 源自 liquid-glass-effect：右下弧形高光 */
    content:"";position:absolute;inset:-2px;border-radius:inherit;
    box-shadow:
      inset -10px -8px 0 -11px rgba(255,255,255,1),
      inset 0 -9px 0 -8px rgba(255,255,255,1);
    opacity:.55;z-index:-1;
    filter:blur(1px) brightness(115%);
    pointer-events:none;
  }

  /* 状态栏 */
  .time{left:35px;top:14px;font-size:17px;font-weight:600;letter-spacing:.2px;line-height:22px;color:var(--ink)}
  .status{right:17px;top:16px;display:flex;align-items:center;gap:5px;height:18px}

  /* 标题 */
  .title{left:17px;top:55px;font-size:29px;line-height:34px;font-weight:700;letter-spacing:1px;color:var(--ink)}

  /* 加号按钮 */
  .plus{left:361px;top:52px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}

  /* 卡片 */
  .card{left:17px;width:380px;border-radius:28px}
  .card1{top:108px;height:198px}
  .card2{top:320px;height:151px}
  .clip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}

  .brand{display:flex;align-items:center;gap:10px;height:26px}
  .brand-name{font-size:17px;font-weight:600;line-height:22px;color:var(--ink);letter-spacing:.1px}
  .dots{display:flex;gap:4px;align-items:center;height:26px}
  .dots i{width:4.5px;height:4.5px;border-radius:50%;background:var(--ink2);display:block}

  /* 标志：读取同目录下用户提供的原始 logo 文件 */
  .logo{width:24px;height:24px;flex:none;position:relative;border-radius:6px}
  .logo img{width:100%;height:100%;object-fit:contain;display:block}
  .logo.empty{border:1px dashed rgba(130,138,150,.55);background:rgba(255,255,255,.35)}
  .logo.empty img{display:none}
  .wm{position:absolute;filter:grayscale(1) brightness(1.15) contrast(.85);opacity:.16;object-fit:contain}
  .wm.empty{display:none}

  .label{font-size:15px;line-height:20px;font-weight:500;color:var(--ink2)}
  .big{font-size:47px;line-height:52px;font-weight:700;letter-spacing:-.5px;color:var(--ink);
       font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",Arial,sans-serif}
  .sub{font-size:13px;line-height:17px;color:var(--muted);font-weight:400;letter-spacing:.2px}

  /* 进度条：玻璃凹槽 + 雾蓝液态玻璃填充 */
  .track{
    position:absolute;height:10px;border-radius:10px;
    background:rgba(255,255,255,.18);
    border:1.5px solid rgba(255,255,255,.95);
    box-shadow:inset 0 0 0 .5px rgba(150,156,168,.35),inset 0 1.5px 2px rgba(110,118,138,.22),0 1.5px 2px rgba(112,118,132,.18);
  }
  /* 蓝色条：实色雾蓝、边缘清晰，不发光不模糊 */
  .fill{
    position:absolute;left:-1.5px;top:-1.5px;bottom:-1.5px;border-radius:10px;
    background:linear-gradient(180deg,#93afe2 0%,#7d9dd8 55%,#7393d0 100%);
    box-shadow:
      inset 0 0 0 .75px rgba(78,108,170,.45),
      inset 0 1.5px 0 rgba(255,255,255,.55),
      0 1px 1.5px rgba(70,96,150,.30);
  }

  /* 底部 */
  .widget{left:0;right:0;top:756px;display:flex;justify-content:center;align-items:center;gap:10px;height:28px}
  .widget span{font-size:15px;line-height:20px;color:var(--ink);font-weight:500;letter-spacing:.3px}
  .tab{top:795px;width:80px;display:flex;flex-direction:column;align-items:center}
  .tab .lab{margin-top:10px;font-size:16px;line-height:20px;font-weight:500}
  .tab1{left:63px}.tab1 .lab{color:var(--ink)}
  .tab2{left:270px}.tab2 .lab{color:var(--nav-off)}
</style>
</head>
<body>
<div id="stage">
<div class="screen">

  <!-- 状态栏 -->
  <div class="abs time">5:57</div>
  <div class="abs status">
    <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#16181c"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><g fill="#16181c"><path d="M8.5 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.2C14 1.6 11.4.5 8.5.5S3 1.6 1 3.5l1.2 1.2C3.9 3.1 6.1 2.2 8.5 2.2z"/><path d="M8.5 5.6c1.5 0 2.8.5 3.9 1.5l1.2-1.2C12.2 4.6 10.4 3.9 8.5 3.9S4.8 4.6 3.4 5.9l1.2 1.2c1.1-1 2.4-1.5 3.9-1.5z"/><path d="M8.5 9c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.6c.4-.4.9-.6 1.5-.6z"/></g></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".6" y=".6" width="22.8" height="11.8" rx="3.6" fill="none" stroke="#16181c" stroke-opacity=".45" stroke-width="1.1"/><rect x="2.3" y="2.3" width="19.4" height="8.4" rx="2.2" fill="#16181c"/><path d="M25 4.4v4.2c.8-.3 1.4-1.1 1.4-2.1S25.8 4.7 25 4.4z" fill="#16181c" fill-opacity=".45"/></svg>
  </div>

  <!-- 标题 + 加号 -->
  <div class="abs title">订阅额度</div>
  <div class="glass plus" aria-label="添加">
    <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1.5v13M1.5 8h13" stroke="#16181c" stroke-width="2.2" stroke-linecap="round"/></svg>
  </div>

  <!-- 卡片一：Cursor -->
  <div class="glass card card1">
    <div class="clip">
      <img class="wm" src="cursor-logo.png" alt="" style="left:276px;top:84px;width:136px;height:136px" onerror="this.classList.add('empty')">
    </div>

    <div class="abs brand" style="left:17px;top:15px">
      <span class="logo"><img src="cursor-logo.png" alt="Cursor" onerror="this.parentNode.classList.add('empty')"></span>
      <span class="brand-name">Cursor</span>
    </div>
    <div class="abs dots" style="right:24px;top:15px"><i></i><i></i><i></i></div>

    <div class="abs label" style="left:17px;top:52px">本月额度</div>
    <div class="abs big" style="left:15px;top:80px">100%</div>
    <div class="track" style="left:17px;top:137px;width:164px"><div class="fill" style="width:calc(100% + 3px)"></div></div>
    <div class="abs sub" style="left:17px;top:153px">预计重置</div>
    <div class="abs sub" style="left:17px;top:169px">11月14日 下午1:46</div>

    <div class="abs label" style="left:199px;top:52px">Grok Bot额度</div>
    <div class="abs big" style="left:197px;top:80px">97%</div>
    <div class="track" style="left:199px;top:137px;width:164px"><div class="fill" style="width:97%"></div></div>
    <div class="abs sub" style="left:199px;top:153px">预计重置</div>
    <div class="abs sub" style="left:199px;top:169px">10月25日 下午7:01</div>
  </div>

  <!-- 卡片二：DeepSeek -->
  <div class="glass card card2">
    <div class="clip">
      <img class="wm" src="deepseek-logo.png" alt="" style="left:268px;top:52px;width:140px;height:140px" onerror="this.classList.add('empty')">
    </div>

    <div class="abs brand" style="left:17px;top:15px">
      <span class="logo"><img src="deepseek-logo.png" alt="DeepSeek" onerror="this.parentNode.classList.add('empty')"></span>
      <span class="brand-name">DeepSeek</span>
    </div>
    <div class="abs dots" style="right:24px;top:15px"><i></i><i></i><i></i></div>

    <div class="abs label" style="left:17px;top:51px">余额</div>
    <div class="abs big" style="left:15px;top:78px">¥19.74</div>
  </div>

  <!-- 如何添加小组件 -->
  <div class="abs widget">
    <svg width="17" height="17" viewBox="0 0 17 17"><g fill="none" stroke="#16181c" stroke-width="1.7"><rect x="1" y="1" width="6" height="6" rx="1.8"/><rect x="10" y="1" width="6" height="6" rx="1.8"/><rect x="1" y="10" width="6" height="6" rx="1.8"/><rect x="10" y="10" width="6" height="6" rx="1.8"/></g></svg>
    <span>如何添加小组件</span>
  </div>

  <!-- 底部导航 -->
  <div class="abs tab tab1">
    <svg width="36" height="36" viewBox="0 0 36 36"><g fill="none" stroke="#16181c" stroke-width="3.2" stroke-linecap="round"><path d="M7.2 28.5A14 14 0 1 1 28.8 28.5"/><path d="M18 20.5l5.6-5.6"/></g></svg>
    <div class="lab">额度</div>
  </div>
  <div class="abs tab tab2">
    <svg width="36" height="36" viewBox="0 0 24 24"><g fill="none" stroke="#8c9098" stroke-width="1.9" stroke-linejoin="round"><path d="M10.3 2.6h3.4l.5 2.6c.7.3 1.3.6 1.9 1.1l2.5-.9 1.7 2.9-2 1.7c.1.7.1 1.4 0 2.1l2 1.7-1.7 2.9-2.5-.9c-.6.5-1.2.8-1.9 1.1l-.5 2.6h-3.4l-.5-2.6c-.7-.3-1.3-.6-1.9-1.1l-2.5.9-1.7-2.9 2-1.7c-.1-.7-.1-1.4 0-2.1l-2-1.7 1.7-2.9 2.5.9c.6-.5 1.2-.8 1.9-1.1z"/><circle cx="12" cy="12" r="3.2"/></g></svg>
    <div class="lab">设置</div>
  </div>

</div>
</div>
<script>
  (function(){
    var s=document.getElementById('stage');
    function fit(){
      var k=Math.min((window.innerHeight-32)/896,(window.innerWidth-24)/414,1.5);
      s.style.transform='scale('+k+')';
    }
    fit();window.addEventListener('resize',fit);
  })();
</script>
</body>
</html>
